name: TTFL Store App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: npm install --include=dev

      - name: Normalize Android app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          magick assets/icon.png /tmp/ttfl-store-icon.png
          mv /tmp/ttfl-store-icon.png assets/icon.png
          file assets/icon.png

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Bundle Android JavaScript
        run: npx expo export --platform android

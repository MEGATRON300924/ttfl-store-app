workflows:
  ttfl-store-android:
    name: TTFL Store Android
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.22.0

    scripts:
      - name: Install npm dependencies
        script: |
          npm install --include=dev

      - name: Normalize Android app icon
        script: |
          if command -v sips >/dev/null 2>&1; then
            sips -s format png assets/icon.png --out /tmp/ttfl-store-icon.png >/dev/null
            mv /tmp/ttfl-store-icon.png assets/icon.png
          else
            echo "sips is unavailable; expected on Codemagic macOS runner"
            exit 1
          fi
          file assets/icon.png

      - name: Verify Expo SDK dependencies
        script: |
          npx expo install --check
          npx expo-doctor

      - name: Generate Android native project
        script: |
          NODE_ENV=production npx expo prebuild --platform android --non-interactive

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build Android release APK
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
